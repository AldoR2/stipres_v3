name: Build APK and Upload to Google Drive

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze
        continue-on-error: true

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK
        run: mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/stipres-${{  github.run_number }}.apk

      - name: Save APK as Github Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stipres-apk-${{  github.run_number }}
          path: output/stipres-${{ github.run_number }}.apk

      - name: Decode Google Service Account
        run: echo "${{ secrets.GDRIVE_SERVICE_ACCOUNT_BASE64 }}"  |  base64 --decode >  service.account.json

      - name: Install Google Drive Uploader Dependencies
        run: python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Upload APK to Google Drive
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/upload_to_drive.py \
          "output/stipres-${{ github.run_number }}.apk"  \
          "$GDRIVE_FOLDER_ID"
